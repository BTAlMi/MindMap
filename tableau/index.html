<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Canopée</title>
<meta name="theme-color" content="#1B1E21">
<meta name="description" content="Canopée — tableaux de cartes libres : notes, images, liens, cadres et flèches. Compagnon de Ramure.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --accent:#2FA36B;--accent-2:#3DBE80;--danger:#E5484D;
  --font:Inter,"Segoe UI",Roboto,system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Mono",Consolas,"SFMono-Regular",Menlo,monospace;
}
:root,[data-theme=dark]{
  --bg:#16181A;--canvas:#1B1E21;--dot:#30353A;--panel:#202326;--panel-2:#25292D;--line:#30353A;--line-2:#4A525A;
  --text:#E7E9EB;--muted:#8F979E;--soft:#2A2F33;--card:#262A2F;--card-line:#3B4248;--shadow:0 8px 30px rgba(0,0,0,.45);
  --accent-soft:rgba(47,163,107,.16);--sel:#3DBE80;--mix:22%;--edge:#7C858D;
}
[data-theme=light]{
  --bg:#EEF0F1;--canvas:#F6F6F3;--dot:#DADCD6;--panel:#FFFFFF;--panel-2:#F4F5F6;--line:#E3E5E7;--line-2:#D3D7DA;
  --text:#1D2125;--muted:#6B737A;--soft:#EEF0F2;--card:#FFFFFF;--card-line:#E1E4E7;--shadow:0 8px 30px rgba(20,30,40,.14);
  --accent-soft:rgba(47,163,107,.12);--sel:#2FA36B;--mix:16%;--edge:#8E979F;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
svg{display:block}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr)}
/* Barre latérale */
#side{grid-column:1;width:260px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;transition:margin .18s}
#app.noside #side{margin-left:-261px}
.sbh{display:flex;align-items:center;gap:8px;padding:12px 12px 8px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;flex:1;min-width:0}
.logo svg{width:24px;height:24px;flex:none}
.ib{border:0;background:transparent;border-radius:8px;height:30px;min-width:30px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);padding:0 6px}
.ib:hover{background:var(--soft);color:var(--text)}
.ib:disabled{opacity:.35;pointer-events:none}
.ib svg{width:17px;height:17px}
.sfind{margin:4px 12px 8px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel-2);border-radius:9px;padding:7px 10px;color:var(--muted);text-align:left}
.sfind:hover{border-color:var(--line-2)}
.sfind span{flex:1}
kbd{font-family:var(--font);font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted);background:var(--panel)}
.snew{margin:0 12px 6px;display:flex;align-items:center;gap:8px;border:0;background:var(--accent);color:#fff;border-radius:9px;padding:8px 10px;font-weight:600;justify-content:center}
.snew:hover{background:var(--accent-2)}
#lib{flex:1;overflow:auto;padding:4px 8px 12px;min-height:0}
.fold{margin-top:10px}
.fh{display:flex;align-items:center;gap:4px;padding:4px 6px;font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);border-radius:6px;user-select:none}
.fh .fn{flex:1;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fh .chev{width:14px;transition:transform .15s;cursor:pointer}
.fold.closed .chev{transform:rotate(-90deg)}
.fold.closed .bl{display:none}
.fh .ib{height:22px;min-width:22px;opacity:0}
.fh:hover .ib{opacity:1}
.bi{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;color:var(--text);user-select:none}
.bi:hover{background:var(--soft)}
.bi.on{background:var(--accent-soft)}
.bi.on .bt{color:var(--accent-2);font-weight:600}
[data-theme=light] .bi.on .bt{color:#1F7A4E}
.bi .dot{width:9px;height:9px;border-radius:3px;flex:none;background:var(--muted)}
.bi .bt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bi .bc{font-size:11px;color:var(--muted)}
.bi .ib{height:22px;min-width:22px;opacity:0;margin-right:-4px}
.bi:hover .ib,.bi.on .ib{opacity:1}
.bi.dragover{outline:2px dashed var(--accent)}
.fold.dragover .fh{background:var(--accent-soft)}
.sbf{border-top:1px solid var(--line);padding:8px 12px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sbf a{color:inherit;text-decoration:none;display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:7px}
.sbf a:hover{background:var(--soft);color:var(--text)}
.sbf .ver{margin-left:auto}
/* Zone principale */
#main{grid-column:2;position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
#top{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel);min-width:0}
#btitle{border:1px solid transparent;background:transparent;border-radius:8px;padding:5px 8px;font-weight:650;font-size:15px;min-width:60px;width:auto;max-width:340px;flex:0 1 auto}
#btitle:hover{border-color:var(--line)}
#btitle:focus{outline:none;border-color:var(--accent);background:var(--panel-2)}
#bmeta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#bmeta .st::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#F5A524;margin:0 6px 1px 4px}
#bmeta .st.ok::before{background:var(--accent)}
#top .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--line-2);background:var(--panel-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--accent-2)}
.btn.dng{color:var(--danger)}
.btn svg{width:16px;height:16px}
#stage{position:relative;flex:1;overflow:hidden;background-color:var(--canvas);touch-action:none;outline:none;cursor:default}
#stage.hand,#stage.panning{cursor:grab}
#stage.panning{cursor:grabbing}
#stage.tool-card,#stage.tool-section,#stage.tool-connect{cursor:crosshair}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#edges path.hit{pointer-events:stroke;stroke:transparent;stroke-width:14;fill:none;cursor:pointer}
#edges path.ln{fill:none;stroke-width:1.6;pointer-events:none}
#edges .sel path.ln{stroke-width:2.6}
#edges .lbl{pointer-events:all;cursor:pointer}
#edges text{font-family:var(--font);font-size:12px}
/* Cadres */
.sec{position:absolute;border:calc(1.5px * max(1, var(--iz,1))) dashed var(--line-2);border-radius:14px;background:color-mix(in srgb,var(--c,transparent) 7%,transparent)}
.sec[style*="--c"]{border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.sec .sh{position:absolute;left:10px;top:-13px;max-width:calc(100% - 20px);display:flex;align-items:center;gap:6px;background:var(--canvas);padding:2px 8px;border-radius:7px;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);cursor:move;white-space:nowrap;overflow:hidden}
.sec[style*="--c"] .sh{color:color-mix(in srgb,var(--c) 75%,var(--text))}
.sec .sh .n{font-weight:500;opacity:.7;text-transform:none;letter-spacing:0}
.sec.sel{border-style:solid;border-color:var(--sel)}
.sec.sel .sh{color:var(--sel)}
.rz{position:absolute;right:-6px;bottom:-6px;width:16px;height:16px;cursor:nwse-resize;display:none;z-index:3}
.rz::after{content:"";position:absolute;right:5px;bottom:5px;width:8px;height:8px;border-right:2px solid var(--sel);border-bottom:2px solid var(--sel);border-radius:0 0 3px 0}
.sec.sel>.rz,.card.sel>.rz{display:block}
.card .rz{cursor:ew-resize}
/* Cartes */
.card{position:absolute;background:var(--card);border:1px solid var(--card-line);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:visible}
.card[style*="--c"]{background:color-mix(in srgb,var(--c) var(--mix),var(--card));border-color:color-mix(in srgb,var(--c) 40%,var(--card-line))}
.card:hover{border-color:var(--line-2)}
.card.sel{border-color:var(--sel);box-shadow:0 0 0 1.5px var(--sel),0 6px 18px rgba(0,0,0,.25)}
.card.drop{box-shadow:0 0 0 2px var(--accent)}
.card .im{border-radius:11px 11px 0 0;overflow:hidden;background:var(--soft)}
.card .im img{display:block;width:100%;height:auto;pointer-events:none;user-select:none;-webkit-user-drag:none}
.card .cb{padding:10px 12px 10px;min-width:0}
.card .ct{font-weight:650;font-size:14px;line-height:1.3;overflow-wrap:anywhere;margin-bottom:4px}
.card .ct:empty::before{content:"Sans titre";color:var(--muted);font-weight:500}
.card .md{font-size:12.5px;line-height:1.5;color:color-mix(in srgb,var(--text) 82%,var(--muted));overflow-wrap:anywhere;max-height:340px;overflow:hidden;position:relative}
.card .md.clip::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;background:linear-gradient(transparent,var(--card))}
.card[style*="--c"] .md.clip::after{background:linear-gradient(transparent,color-mix(in srgb,var(--c) var(--mix),var(--card)))}
.md p{margin:0 0 6px}
.md h1,.md h2,.md h3{margin:6px 0 4px;font-size:13.5px;line-height:1.3}
.md h1{font-size:15px}
.md ul,.md ol{margin:0 0 6px;padding-left:18px}
.md li{margin:1px 0}
.md li.tk{list-style:none;margin-left:-18px;display:flex;gap:6px;align-items:flex-start}
.md li.tk input{margin:3px 0 0;accent-color:var(--accent);cursor:pointer;flex:none}
.md li.tk.done>span{text-decoration:line-through;opacity:.6}
.md code{font-family:var(--mono);font-size:11.5px;background:var(--soft);border-radius:4px;padding:1px 4px}
.md pre{background:var(--soft);border-radius:8px;padding:8px;overflow:auto;margin:0 0 6px}
.md pre code{background:none;padding:0}
.md blockquote{margin:0 0 6px;padding-left:9px;border-left:3px solid var(--line-2);color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--line-2);margin:8px 0}
.md a{color:var(--accent-2)}
[data-theme=light] .md a{color:#1F7A4E}
.md table{border-collapse:collapse;font-size:12px;margin:0 0 6px}
.md td,.md th{border:1px solid var(--line-2);padding:2px 6px}
.card .lk{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--panel-2);overflow:hidden}
.card .lk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .lk svg{width:14px;height:14px;flex:none}
.card .tg{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tag{font-size:11px;border-radius:6px;padding:1px 7px;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.card .pg{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;color:var(--muted)}
.card .pg i{flex:1;height:4px;border-radius:3px;background:var(--soft);overflow:hidden}
.card .pg i b{display:block;height:100%;background:var(--accent)}
.port{position:absolute;top:50%;right:-9px;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--panel);border:2px solid var(--sel);display:none;cursor:crosshair;z-index:3}
.card:hover>.port,.card.sel>.port,.sec.sel>.port{display:block}
.sec>.port{top:-8px;right:24px;margin-top:0}
#stage.tool-connect .card>.port{display:block}
.card.hit{box-shadow:0 0 0 2px var(--accent)}
#marquee{position:absolute;border:1px solid var(--sel);background:color-mix(in srgb,var(--sel) 12%,transparent);border-radius:4px;pointer-events:none;display:none;z-index:5}
#empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;color:var(--muted);text-align:center;line-height:1.8;padding:20px}
#empty.show{display:flex}
#empty b{color:var(--text)}
/* Barre d'outils */
#tools.left{left:14px;transform:none}
#tools{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:5px;background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);z-index:20}
#tools .ib{height:34px;min-width:34px}
#tools .ib.on{background:var(--accent-soft);color:var(--accent-2)}
[data-theme=light] #tools .ib.on{color:#1F7A4E}
#tools .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
#zl{min-width:48px;text-align:center;font-size:12px;color:var(--muted);border:0;background:transparent;border-radius:7px;height:30px}
#zl:hover{background:var(--soft)}
#mini{position:absolute;right:14px;bottom:14px;width:190px;height:124px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:19;overflow:hidden;cursor:pointer;touch-action:none}
#mini canvas{width:100%;height:100%;display:block}
/* Panneau de détail */
#det{grid-column:3;width:0;overflow:hidden;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;transition:width .18s}
#det.open{width:390px}
#detIn{width:390px;display:flex;flex-direction:column;height:100%;min-height:0}
.dh{display:flex;align-items:center;gap:8px;padding:12px 14px 4px;font-size:12px;color:var(--muted)}
.dh .sp{flex:1}
.dh .ty{display:inline-flex;align-items:center;gap:5px}
.dh .ty::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
#detBody{flex:1;overflow:auto;padding:4px 14px 14px;min-height:0;display:flex;flex-direction:column}
.dt{width:100%;border:0;background:transparent;font-size:21px;font-weight:700;padding:6px 0;outline:none}
.dtabs{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);margin:4px 0 10px}
.dtabs button{border:0;background:transparent;padding:6px 0 8px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:5px}
.dtabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.dtabs .cnt{margin-left:auto;font-size:12px;color:var(--muted)}
#dBody{width:100%;min-height:220px;flex:1;resize:none;border:0;background:transparent;outline:none;font-family:var(--mono);font-size:13px;line-height:1.6}
#dPrev{min-height:220px;flex:1;font-size:14px;color:var(--text);max-height:none}
.fl{font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin:16px 0 6px;display:flex;align-items:center;gap:6px}
.inp{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:9px;padding:7px 10px;outline:none}
.inp:focus{border-color:var(--accent)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sw{display:flex;gap:7px;flex-wrap:wrap}
.sw button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;padding:0;background:var(--c,var(--soft));box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.sw button.none{background:var(--card);box-shadow:inset 0 0 0 1px var(--line-2);position:relative}
.sw button.none::after{content:"";position:absolute;left:3px;right:3px;top:50%;height:1.5px;background:var(--muted);transform:rotate(-45deg)}
.sw button.on{border-color:var(--text)}
.lst{list-style:none;margin:0;padding:0}
.lst li{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.lst li button.go{border:0;background:transparent;padding:0;text-align:left;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.lst li button.go:hover{color:var(--accent-2)}
.lst .ar{color:var(--muted);flex:none;width:16px}
.df{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line)}
.df .btn{padding:6px 10px;font-size:13px}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}
.dimg{border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.dimg img{display:block;width:100%}
/* Menus, modales, palette */
.menu{position:fixed;z-index:80;min-width:230px;max-width:calc(100vw - 16px);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:5px;display:none;max-height:calc(100dvh - 20px);overflow:auto}
.menu.open{display:block}
.menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:8px}
.menu button:hover,.menu button:focus-visible{background:var(--soft);outline:none}
.menu button .k{margin-left:auto;font-size:11px;color:var(--muted)}
.menu button.dng{color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px}
.menu .mh{font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);padding:6px 10px 2px}
#modal{position:fixed;inset:0;background:rgba(5,8,10,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
#modal.open{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:min(720px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:18px 20px 20px}
.mbox .mh2{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mbox h2{font-size:18px;margin:0}
.mbox p{line-height:1.55}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.tpl{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;background:var(--panel-2);display:flex;flex-direction:column;gap:6px;min-height:92px}
.tpl:hover{border-color:var(--accent);background:var(--accent-soft)}
.tpl b{font-size:14px}
.tpl span{font-size:12.5px;color:var(--muted);line-height:1.4}
table.keys{border-collapse:collapse;width:100%;font-size:13px}
table.keys td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.keys td:first-child{white-space:nowrap;font-weight:600;width:1%}
#pal{position:fixed;inset:0;z-index:110;display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;background:rgba(5,8,10,.5)}
#pal.open{display:flex}
.pbox{width:min(640px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;max-height:70vh}
.pin{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.pin input{flex:1;border:0;background:transparent;outline:none;font-size:16px}
.pin svg{width:18px;height:18px;color:var(--muted)}
#palList{overflow:auto;padding:6px}
.pg2{font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px;display:flex;justify-content:space-between}
.pi{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer}
.pi.on{background:var(--accent-soft)}
.pi .pt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi .ps{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:45%}
.pi mark{background:transparent;color:var(--accent-2);font-weight:700}
.pfoot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;z-index:120;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100vw - 32px);text-align:center}
#toast.show{opacity:1}
#banner{position:fixed;left:50%;top:60px;transform:translateX(-50%);z-index:119;background:#7A4A00;color:#FFF;padding:8px 14px;border-radius:10px;font-size:12.5px;display:none;max-width:calc(100vw - 32px);text-align:center}
#scrim{position:fixed;inset:0;background:rgba(5,8,10,.45);z-index:39;display:none}
input[type=file]{display:none}

<script>
(() => {
'use strict';
/* ============================================================
   Canopée — tableaux de cartes libres. Compagnon de Ramure.
   Données : brouillons dans cet appareil (IndexedDB), fichiers .canopee (OneDrive).
   Rien n'est envoyé sur internet.
   ============================================================ */
const VERSION = '1.0';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = (p = '') => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const deepCopy = o => JSON.parse(JSON.stringify(o));
const oneLine = s => String(s ?? '').replace(/\s+/g, ' ').trim();
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const ID_RE = /^[A-Za-z0-9_-]{1,64}$/;
const HREF_RE = /^(https?:\/\/|mailto:)/i;
const IMG_RE = /^data:image\/(png|jpeg|jpg|gif|webp);base64,[A-Za-z0-9+/=]+$/;
const IN_FRAME = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const LSJ = (k, d) => { try { const v = JSON.parse(LS.get(k) || 'null'); return v ?? d; } catch (e) { return d; } };
let toastT;
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms); }
const plural = (n, w) => n + ' ' + w + (n > 1 ? 's' : '');
const fmtDate = t => { try { return new Date(t).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }); } catch (e) { return ''; } };
const safeName = s => (oneLine(s).replace(/[\\/:*?"<>|]+/g, '-').slice(0, 80) || 'tableau');
const IS_TOUCH = () => matchMedia('(pointer:coarse)').matches;
const SMALL = () => matchMedia('(max-width:820px)').matches;

/* ---------- Couleurs ---------- */
const COLORS = {
  red: { n: 'Rouge', h: '#E5484D' }, orange: { n: 'Orange', h: '#F76B15' }, yellow: { n: 'Jaune', h: '#F5B83D' }, green: { n: 'Vert', h: '#30A46C' },
  teal: { n: 'Turquoise', h: '#12A594' }, blue: { n: 'Bleu', h: '#0090FF' }, violet: { n: 'Violet', h: '#8E4EC6' }, pink: { n: 'Rose', h: '#D6409F' }, gray: { n: 'Gris', h: '#8B8D98' }
};
const colVar = c => COLORS[c] ? `--c:${COLORS[c].h};` : '';
function hexRgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(x => x + x).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mixHex(a, b, p) { const A = hexRgb(a), B = hexRgb(b); return '#' + A.map((v, i) => Math.round(v * p + B[i] * (1 - p)).toString(16).padStart(2, '0')).join(''); }
function nearestColor(hex) {
  if (typeof hex !== 'string' || !/^#[0-9a-f]{3,6}$/i.test(hex)) return '';
  const A = hexRgb(hex); let best = '', bd = 1e9;
  for (const [k, v] of Object.entries(COLORS)) { const B = hexRgb(v.h); const d = (A[0] - B[0]) ** 2 + (A[1] - B[1]) ** 2 + (A[2] - B[2]) ** 2; if (d < bd) { bd = d; best = k; } }
  return best;
}
const swatches = (cur, attr = 'data-col') => `<div class="sw"><button class="none${!cur ? ' on' : ''}" ${attr}="" title="Aucune"></button>` + Object.entries(COLORS).map(([k, v]) => `<button class="${cur === k ? 'on' : ''}" ${attr}="${k}" style="--c:${v.h}" title="${v.n}"></button>`).join('') + '</div>';

/* ---------- Thème ---------- */
let themePref = LS.get('canopee:theme') || '';
function applyTheme() {
  const dark = themePref ? themePref === 'dark' : !matchMedia('(prefers-color-scheme: light)').matches;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.querySelector('meta[name=theme-color]').content = dark ? '#1B1E21' : '#F6F6F3';
  renderMini();
}
function toggleTheme() { themePref = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; LS.set('canopee:theme', themePref); applyTheme(); }
matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (!themePref) applyTheme(); });
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- Stockage local (IndexedDB) ---------- */
let dbP = null;
function db() {
  if (!dbP) dbP = new Promise((res, rej) => {
    const r = indexedDB.open('canopee', 1);
    r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('b')) d.createObjectStore('b'); if (!d.objectStoreNames.contains('h')) d.createObjectStore('h'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return dbP;
}
async function idb(store, mode, fn) {
  const d = await db();
  return new Promise((res, rej) => { const t = d.transaction(store, mode); const s = t.objectStore(store); const r = fn(s); t.oncomplete = () => res(r && 'result' in r ? r.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
}
const idbGet = (s, k) => idb(s, 'readonly', st => st.get(k)).catch(() => undefined);
const idbPut = (s, k, v) => idb(s, 'readwrite', st => st.put(v, k));
const idbDel = (s, k) => idb(s, 'readwrite', st => st.delete(k)).catch(() => {});
const idbAll = s => idb(s, 'readonly', st => st.getAll()).catch(() => []);

/* Passerelle Ramure ⇄ Canopée (même origine) */
function pxDB() { return new Promise((res, rej) => { const r = indexedDB.open('passerelle', 1); r.onupgradeneeded = () => r.result.createObjectStore('x'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function pxPut(key, val) { const d = await pxDB(); await new Promise((res, rej) => { const t = d.transaction('x', 'readwrite'); t.objectStore('x').put(val, key); t.oncomplete = res; t.onerror = () => rej(t.error); }); d.close(); }
async function pxTake(key) {
  const d = await pxDB();
  const v = await new Promise((res, rej) => { const t = d.transaction('x', 'readwrite'); const s = t.objectStore('x'); const g = s.get(key); g.onsuccess = () => { if (g.result !== undefined) s.delete(key); }; t.oncomplete = () => res(g.result); t.onerror = () => rej(t.error); });
  d.close(); return v;
}

/* ---------- Modèle ---------- */
function normalizeBoard(d) {
  d = d && typeof d === 'object' ? d : {};
  const seen = new Set(); const okId = (id, p) => { let v = (typeof id === 'string' && ID_RE.test(id) && !seen.has(id)) ? id : uid(p); seen.add(v); return v; };
  const num = (v, def, a, b) => (typeof v === 'number' && isFinite(v)) ? clamp(v, a, b) : def;
  const assets = {};
  if (d.assets && typeof d.assets === 'object') for (const [k, v] of Object.entries(d.assets)) if (ID_RE.test(k) && typeof v === 'string' && IMG_RE.test(v)) assets[k] = v;
  const cards = (Array.isArray(d.cards) ? d.cards : []).filter(c => c && typeof c === 'object').slice(0, 5000).map(c => {
    const o = { id: okId(c.id, 'c'), type: ['text', 'image', 'link'].includes(c.type) ? c.type : 'text', x: num(c.x, 0, -1e6, 1e6), y: num(c.y, 0, -1e6, 1e6), w: num(c.w, 260, 140, 900), title: String(c.title ?? '').slice(0, 300), body: String(c.body ?? '').slice(0, 100000), tags: Array.isArray(c.tags) ? c.tags.map(t => oneLine(t).slice(0, 40)).filter(Boolean).slice(0, 20) : [], color: COLORS[c.color] ? c.color : '', created: c.created || Date.now(), updated: c.updated || Date.now() };
    if (typeof c.href === 'string' && HREF_RE.test(c.href.trim())) o.href = c.href.trim().slice(0, 2000);
    if (typeof c.asset === 'string' && assets[c.asset]) { o.asset = c.asset; o.ratio = num(c.ratio, 0.75, 0.05, 20); }
    if (o.type === 'image' && !o.asset) o.type = 'text';
    if (o.type === 'link' && !o.href) o.type = 'text';
    return o;
  });
  const sections = (Array.isArray(d.sections) ? d.sections : []).filter(s => s && typeof s === 'object').slice(0, 1000).map(s => ({ id: okId(s.id, 's'), x: num(s.x, 0, -1e6, 1e6), y: num(s.y, 0, -1e6, 1e6), w: num(s.w, 400, 120, 20000), h: num(s.h, 300, 80, 20000), title: String(s.title ?? 'Cadre').slice(0, 120), color: COLORS[s.color] ? s.color : '' }));
  const ids = new Set([...cards.map(c => c.id), ...sections.map(s => s.id)]);
  const edges = (Array.isArray(d.edges) ? d.edges : []).filter(e => e && ids.has(e.from) && ids.has(e.to) && e.from !== e.to).slice(0, 5000).map(e => ({ id: okId(e.id, 'e'), from: e.from, to: e.to, label: oneLine(e.label).slice(0, 120), color: COLORS[e.color] ? e.color : '', arrow: ['end', 'both', 'none'].includes(e.arrow) ? e.arrow : 'end' }));
  const v = d.view && typeof d.view === 'object' && isFinite(d.view.x) && isFinite(d.view.y) && isFinite(d.view.k) ? { x: +d.view.x, y: +d.view.y, k: clamp(+d.view.k, 0.1, 3) } : null;
  return { app: 'canopee', version: 1, id: (typeof d.id === 'string' && ID_RE.test(d.id)) ? d.id : uid('b'), title: String(d.title || 'Sans titre').slice(0, 160), color: COLORS[d.color] ? d.color : '', created: d.created || Date.now(), updated: d.updated || Date.now(), cards, sections, edges, assets, view: v };
}

/* ---------- Modèles de tableau ---------- */
